name: Python package metadata

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate declared Python requirement
        run: python scripts/ci/validate-python-version-wheel.py
